name: warp-cache-e2e

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  save:
    name: save (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            warp-ubuntu-latest-x64-2x,
            warp-windows-2022-x64-4x,
            warp-macos-14-arm64-6x
          ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The cache key is derived from this file's hash, so a per-run value
      # guarantees a fresh key and a genuine miss -> save -> hit round trip.
      - name: Write run-unique requirements file
        shell: bash
        run: |
          mkdir -p warp-fixture
          printf '# warp-cache-e2e %s-%s\nsix==1.16.0\n' \
            "${{ github.run_id }}" "${{ github.run_attempt }}" \
            > warp-fixture/requirements.txt

      - name: Setup Python
        id: setup
        uses: ./
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: warp-fixture/requirements.txt

      - name: Assert cache miss on a fresh key
        shell: bash
        run: |
          if [ "${{ steps.setup.outputs.cache-hit }}" != "false" ]; then
            echo "expected a miss on a run-unique key, got cache-hit=${{ steps.setup.outputs.cache-hit }}"
            exit 1
          fi

      # Give the post step real bytes to upload.
      - name: Populate the pip cache
        shell: bash
        run: pip install -r warp-fixture/requirements.txt

  restore:
    name: restore (${{ matrix.os }})
    needs: save
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            warp-ubuntu-latest-x64-2x,
            warp-windows-2022-x64-4x,
            warp-macos-14-arm64-6x
          ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Write the same run-unique requirements file
        shell: bash
        run: |
          mkdir -p warp-fixture
          printf '# warp-cache-e2e %s-%s\nsix==1.16.0\n' \
            "${{ github.run_id }}" "${{ github.run_attempt }}" \
            > warp-fixture/requirements.txt

      - name: Setup Python
        id: setup
        uses: ./
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: warp-fixture/requirements.txt

      - name: Assert the cache saved by the save job was restored
        shell: bash
        run: |
          if [ "${{ steps.setup.outputs.cache-hit }}" != "true" ]; then
            echo "expected an exact-key hit on the cache saved by the save job"
            exit 1
          fi
